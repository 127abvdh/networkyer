<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="formbox"><h1>ثبت‌نام رایگان</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}
<form method="post"><input name="name" placeholder="نام" required><input name="phone" placeholder="شماره موبایل" required><input name="password" type="password" placeholder="رمز عبور" required><input name="ref" value="{{ref}}" placeholder="کد معرف (اختیاری)"><button class="btn">ساخت حساب</button></form><p><a href="/login">قبلاً حساب داری؟ ورود</a></p></div></body></html>
